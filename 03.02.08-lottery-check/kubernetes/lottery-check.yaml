# Версия API.
apiVersion: apps/v1
# Тип ресурса Deployment. В этом YAML-файле
# Описывается именно Deployment.
kind: StatefulSet
metadata:
  # Наименование Deployment
  name: lottery-check-pg
spec:
  # Один работающий под.
  # PostgreSQL нужно дополнительно настраивать,
  # чтобы он мог работать в режиме кластера.
  # В этом примере мы не будем этим заниматься.
  # Настройка PostgreSQL в режиме кластера выходит за 
  # рамки этой книги.
  replicas: 1
  # Селектор описывает, какими подами будет управлять создаваемый
  # ReplicaSet. Используем стандартную метку наименования.
  selector:
    matchLabels:
      app.kubernetes.io/name: lottery-check-pg
  template:
    metadata:
      labels:
        # Каждому поду назначается метка с наименованием,
        # для того чтобы в последующем ReplicaSet мог
        # найти поды, которыми он управляет.
        app.kubernetes.io/name: lottery-check-pg
    spec:
      containers:
        # Один контейнер с наименованием postgresql.
        - name: postgresql
          # Образ PostgreSQL для создания контейнера.
          image: postgres:18.6-alpine3.23
          # Настройка образа через переменные окружения.
          # Подробности см. https://hub.docker.com/_/postgres
          envFrom:
            - secretRef:
                name: lottery-check-pg-secret
          # livenessProbe для определения, когда
          # контейнер окончательно завис, и его нужно 
          # перезапустить.
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - lottery-check
                - -U
                - lottery-check
            # Первые 10 секунд перезапускать контейнер точно не
            # нужно. 
            initialDelaySeconds: 10
            # Каждые 10 секунд проверяем, что контейнер
            # ещё живой, и его не нужно перезапустить
            # каждый 10 секунд.
            periodSeconds: 10
          # Проверка готовности контейнера
          # обслуживать запросы.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - lottery-check
                - -U
                - lottery-check
            # В первые 5 секунд после запуска контейнера
            # мы не будем проверять его готовность обслуживать
            # запросы..
            initialDelaySeconds: 5
            # Проверяем готовность контейнера принимать запросы
            # каждые 5 секунд.
            periodSeconds: 5
          # Точка монтирования тома для хранения данных PostgreSQL.
          volumeMounts:
            - name: postgresql-storage
              # Каталог данных PostgreSQL внутри контейнера.
              mountPath: /var/lib/postgresql
              # Подкаталог на томе, чтобы данные хранились отдельно от
              # корневой файловой системы тома.
              subPath: pgdata
  volumeClaimTemplates:
  - metadata:
      name: postgresql-storage
    spec:
      # Для  PersistentVolumeClaim с storageClassName
      # minikube создаёт PersistentVolume автоматически.
      storageClassName: standard
      accessModes:
        # Том может быть подключён только к одному поду 
        - ReadWriteOncePod
      resources:
        requests:
          # Требует хранилище объёмом 1 гигабайт.
          storage: 1Gi
  serviceName: lottery-check-pg-service
---
# Версия API.
apiVersion: v1
# Тип ресурса.
# Сервис необходим для обращения к нашему PostgreSQL.
kind: Service
metadata:
  # Наименование сервиса
  name: lottery-check-pg-service
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    # Сервис создаётся для подов со следующими
    # метками.
    app.kubernetes.io/name: lottery-check-pg
  ports:
    # Сервис подключается к порту 5432 подов.
    - port: 5432


---
# Версия API.
apiVersion: apps/v1
# Тип ресурса Deployment. В этом YAML-файле
# Описывается именно Deployment.
kind: Deployment
metadata:
  # Наименование Deployment
  name: lottery-check
spec:

  replicas: 1
  # Селектор описывает, какими подами будет управлять создаваемый
  # ReplicaSet. Используем стандартную метку наименования.
  selector:
    matchLabels:
      app.kubernetes.io/name: lottery-check
  template:
    metadata:
      labels:
        # Каждому поду назначается метка с наименованием,
        # для того чтобы в последующем ReplicaSet мог
        # найти поды, которыми он управляет.
        app.kubernetes.io/name: lottery-check
    spec:
      containers:
        # 
        - name: postgresql
          # 
          image: urvanov/lottery-check
          # 
          env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: lottery-check-config
                key: SPRING_DATASOURCE_URL
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: lottery-check-pg-secret
                key: POSTGRES_USER
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lottery-check-pg-secret
                key: POSTGRES_PASSWORD
          # livenessProbe проверяет, что приложение живо
          # (не зависло), через Actuator. Проверка не зависит
          # от базы данных.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe проверяет, что приложение готово
          # принимать запросы. Группа readiness включает проверку
          # подключения к PostgreSQL, поэтому пока база недоступна,
          # под не будет получать трафик.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Для самостоятельно собираемых образов
          # важно выставлять политику выкачивания из
          # реестра IfNotPresent или Never.
          imagePullPolicy: IfNotPresent

---
# Версия API.
apiVersion: v1
# Тип ресурса.
# Сервис необходим для обращения к нашему PostgreSQL.
kind: Service
metadata:
  # Наименование сервиса
  name: lottery-check
spec:
  type: NodePort
  selector:
    # Сервис создаётся для подов со следующими
    # метками.
    app.kubernetes.io/name: lottery-check
  ports:
    # Сервис подключается к порту 5432 подов.
    - port: 8080


