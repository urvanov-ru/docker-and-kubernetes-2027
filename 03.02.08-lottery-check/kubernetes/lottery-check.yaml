################################################################################
# PostgreSQL
################################################################################
# Версия API.
apiVersion: apps/v1
# Тип ресурса StatefulSet. В этом YAML-файле
# Описывается именно StatefulSet, так у нашего PostgreSQL
# существует сохраняемое между запусками состояние.
kind: StatefulSet
metadata:
  # Наименование StatefulSet
  name: lottery-check-pg
spec:
  # Один работающий под.
  # PostgreSQL нужно дополнительно настраивать,
  # чтобы он мог работать в режиме кластера.
  # В этом примере мы не будем этим заниматься.
  # Настройка PostgreSQL в режиме кластера выходит за 
  # рамки этой книги. Сами экземпляры PostgreSQL
  # не могут работать с одним и тем же каталогом PG_DATA.
  replicas: 1
  # Селектор описывает, какими подами будет управлять создаваемый
  # StatefulSet. Используем стандартную метку наименования
  # app.kubernetes.io/name с наименованием приложения.
  selector:
    matchLabels:
      app.kubernetes.io/name: lottery-check-pg
  # Каждый под получает постоянное сетевое имя на основе
  # значения из поля serviceName.
  serviceName: lottery-check-pg-service
  template:
    metadata:
      labels:
        # Каждому поду назначается метка с наименованием,
        # для того чтобы в последующем StatefulSet мог
        # найти поды, которыми он управляет.
        app.kubernetes.io/name: lottery-check-pg
    spec:
      containers:
        # Один контейнер с наименованием postgresql.
        - name: postgresql
          # Образ PostgreSQL для создания контейнера.
          image: postgres:18.6-alpine3.23
          # Настройка образа через переменные окружения.
          # Подробности см. https://hub.docker.com/_/postgres
          envFrom:
            - secretRef:
                name: lottery-check-pg-secret
          # livenessProbe для определения, когда
          # контейнер окончательно завис, и его нужно 
          # перезапустить.
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - lottery-check
                - -U
                - lottery-check
            # Первые 10 секунд перезапускать контейнер точно не
            # нужно. 
            initialDelaySeconds: 10
            # Каждые 10 секунд проверяем, что контейнер
            # ещё живой, и его не нужно перезапустить
            # каждый 10 секунд.
            periodSeconds: 10
          # Проверка готовности контейнера
          # обслуживать запросы.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - lottery-check
                - -U
                - lottery-check
            # В первые 5 секунд после запуска контейнера
            # мы не будем проверять его готовность обслуживать
            # запросы..
            initialDelaySeconds: 5
            # Проверяем готовность контейнера принимать запросы
            # каждые 5 секунд.
            periodSeconds: 5
          # Точка монтирования тома для хранения данных PostgreSQL.
          volumeMounts:
            - name: postgresql-storage
              # Каталог данных PostgreSQL внутри контейнера.
              mountPath: /var/lib/postgresql
              # Подкаталог на томе, чтобы данные хранились отдельно от
              # корневой файловой системы тома.
              subPath: pgdata
  volumeClaimTemplates:
  - metadata:
      name: postgresql-storage
    spec:
      # Для  PersistentVolumeClaim с storageClassName
      # minikube создаёт PersistentVolume автоматически.
      storageClassName: standard
      accessModes:
        # Том может быть подключён только к одному поду 
        - ReadWriteOncePod
      resources:
        requests:
          # Требует хранилище объёмом 1 гигабайт.
          storage: 1Gi
---

################################################################################
# Сервис проверки лотерейных билетов
################################################################################
# Версия API.
apiVersion: apps/v1
# Тип ресурса Deployment. В этом YAML-файле
# Описывается именно Deployment.
kind: Deployment
metadata:
  # Наименование Deployment
  name: lottery-check
spec:

  replicas: 3
  # Селектор описывает, какими подами будет управлять создаваемый
  # ReplicaSet. Используем стандартную метку наименования.
  selector:
    matchLabels:
      app.kubernetes.io/name: lottery-check
  template:
    metadata:
      labels:
        # Каждому поду назначается метка с наименованием,
        # для того чтобы в последующем ReplicaSet мог
        # найти поды, которыми он управляет.
        app.kubernetes.io/name: lottery-check
    spec:
      containers:
        # Основной контейнер с запущенным сервисом
        # проверки лотерейных билетов.
        - name: main
          # Базовый образ, собираемый с помощью Spring Boot
          # плагина.
          image: urvanov/lottery-check
          # Настройки подключения к базе данных
          # и прочие.
          env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: lottery-check-config
                key: jdbc_url
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: lottery-check-pg-secret
                key: POSTGRES_USER
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: lottery-check-pg-secret
                key: POSTGRES_PASSWORD
          - name: SPRING_FLYWAY_ENABLED
            value: false
          # livenessProbe проверяет, что приложение живо
          # (не зависло), через Actuator. Проверка не зависит
          # от базы данных.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe проверяет, что приложение готово
          # принимать запросы. Группа readiness включает проверку
          # подключения к PostgreSQL, поэтому пока база недоступна,
          # под не будет получать трафик.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Для самостоятельно собираемых образов
          # важно выставлять политику выкачивания из
          # реестра IfNotPresent или Never.
          imagePullPolicy: IfNotPresent
      initContainers:
      # Контейнер, выполняющий скрипты миграции Flyway
      - name: flyway-initialization
        # Используется образ, заранее собранный самостоятельно.
        image: urvanov/lottery-check-init:latest
        # Контейнер ицициализации принимает параметры
        # подключения к базе данных в переменных окружения.
        # Передаём ему эти переменные окружения из секретов.
        env:
        # Переменная окружения FLYWAY_URL используется
        # для передачи адреса базы данных.
        # Заполняем его значением
        # с ключом jdbc_url из ConfigMap с наименованием
        # lottery-check-config. 
        - name: FLYWAY_URL
          valueFrom:
            configMapKeyRef:
              name: lottery-check-config
              key: jdbc_url
        # Переменная окружения FLYWAY_USER используется
        # для передачи логина базы данных..
        # Заполняем её логином пользователя из секрета
        # lottery-check-pg-secret. Логин пользователя
        # хранится в секрете по ключу POSTGRES_USER.
        - name: FLYWAY_USER
          valueFrom:
            secretKeyRef:
              name: lottery-check-pg-secret
              key: POSTGRES_USER
        # Переменная окружения FLYWAY_PASSWORD используется
        # для передачи пароля пользователя базы данных.
        # Заполняем её паролем пользвоаетеля из секрета
        # lottery-check-pg-secret. Пароль пользователя в
        # секрете хранится по ключу POSTGRES_PASSWORD.
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lottery-check-pg-secret
              key: POSTGRES_PASSWORD

---
# Версия API.
apiVersion: v1
# Тип ресурса.
# Сервис необходим для обращения к нашему PostgreSQL.
kind: Service
metadata:
  # Наименование сервиса
  name: lottery-check
spec:
  type: NodePort
  selector:
    # Сервис создаётся для подов со следующими
    # метками.
    app.kubernetes.io/name: lottery-check
  ports:
    # Сервис подключается к порту 5432 подов.
    - port: 8080


