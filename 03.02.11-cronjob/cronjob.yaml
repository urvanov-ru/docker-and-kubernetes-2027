# Версия API.
# apiVersion для CronJob отличается от того,
# который использовался при описании Deployment.
apiVersion: batch/v1
# Тип ресурса CronJob. В этом YAML-файле
# описывается именно CronJob.
kind: CronJob
metadata:
  # Наименование CronJob.
  name: postgres-vacuum-full
spec:
  # Расписание в формате cron. Пять полей:
  # минута, час, день месяца, месяц, день недели.
  # Выражение "0 3 * * *" означает запуск
  # каждую ночь в 3 часа.
  schedule: "0 3 * * *"
  # Запрещаем запускать новый CronJob, пока не завершился
  # предыдущий: VACUUM FULL блокирует таблицы и
  # переписывает их целиком, поэтому параллельные
  # запуски недопустимы.
  concurrencyPolicy: Forbid
  # Сколько завершённых и неуспешных CronJob хранить
  # в истории.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # Шаблон Job, который создаётся по расписанию.
  jobTemplate:
    spec:
      template:
        spec:
          # Это обязательное поле для Job.
          # возможные значения: Never, OnFailure.
          restartPolicy: OnFailure
          containers:
          # Под содержит один контейнер
          # с наименованием vacuum-full.
          - name: vacuum-full
            # Тот же образ, что и у сервера PostgreSQL
            # из StatefulSet. В нём есть клиент psql.
            image: postgres:18.6-alpine3.23
            # Клиент psql (библиотека libpq) читает параметры
            # подключения из переменных окружения PGHOST,
            # PGUSER и PGPASSWORD.
            env:
            # Адрес headless-сервиса PostgreSQL.
            - name: PGHOST
              value: lottery-check-pg-0.lottery-check-pg-service
            # Логин пользователя базы данных из секрета
            # lottery-check-pg-secret (ключ POSTGRES_USER).
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: lottery-check-pg-secret
                  key: POSTGRES_USER
            # Пароль пользователя базы данных из секрета
            # lottery-check-pg-secret (ключ POSTGRES_PASSWORD).
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lottery-check-pg-secret
                  key: POSTGRES_PASSWORD
            # Команда запуска VACUUM FULL во всех таблицах
            # базы данных. psql читает PGHOST, PGUSER
            # и PGPASSWORD из переменных окружения выше,
            # поэтому оболочка не нужна: код возврата psql
            # становится кодом возврата контейнера.
            command:
              - psql
              - --command
              - "VACUUM FULL VERBOSE;"
